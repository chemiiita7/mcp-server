services:
  mcp-lab-server:
    build: .
    container_name: mcp-lab-server
    user: "1000:1000"
    mem_limit: 256m
    network_mode: host
    restart: unless-stopped
    environment:
      MCP_PROFILE: admin
      # 0.0.0.0 con network_mode: host significa, en la práctica, localhost + tailnet:
      # el cortafuegos del VPS solo acepta lo que entra por tailscale0 (cadena ts-input),
      # el 22 y el 25565; el resto cae en el REJECT final. Si algún día se tocan esas
      # reglas, esto queda expuesto: el perfil admin no pide autenticación.
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_TRANSPORT: streamable-http
      DOCKER_HOST: "tcp://127.9.9.1:2375"
      MC_CONTAINER: "minecraft-server"
    # Secretos: archivo sin seguimiento junto a este compose en el VPS.
    # Lo lee docker compose en el host, el contenedor solo recibe las variables.
    env_file:
      - secrets.env
    volumes:
      - ./:/app                                          # código en caliente
      - /home/ubuntu/apps/lab-ai/obsidian-vault:/vault
      - /home/ubuntu/apps/lab-ai/data:/data
      - /home/ubuntu/apps/minecraft:/minecraft
