services:
  mcp-lab-server:
    build: .
    container_name: mcp-lab-server
    # uid de hermes: dueño de la bóveda y quien corre Syncthing en este VPS. Así lo que
    # escribe el MCP es de hermes y Syncthing lo sincroniza con el PC sin líos de permisos.
    user: "1001:1001"
    mem_limit: 256m
    network_mode: host
    restart: unless-stopped
    environment:
      MCP_PROFILE: admin
      TZ: Europe/Madrid            # qué es "hoy" para el parte diario
      # Solo localhost. En Contabo la IP es pública y no hay cortafuegos del proveedor:
      # con 0.0.0.0 el perfil admin (sin autenticación) dependería solo de ufw. Para
      # usarlo desde tu tailnet, el VPS lo publica con  tailscale serve --bg 8000
      # (https://<maquina>.<tailnet>.ts.net/mcp), y Beira llega por 127.0.0.1.
      MCP_HOST: "127.0.0.1"
      MCP_PORT: "8000"
      MCP_TRANSPORT: streamable-http
      DOCKER_HOST: "tcp://127.9.9.1:2375"
      MC_CONTAINER: "minecraft-server"
    # Secretos: archivo sin seguimiento junto a este compose en el VPS.
    # Lo lee docker compose en el host, el contenedor solo recibe las variables.
    env_file:
      - secrets.env
    volumes:
      - ./:/app                                          # código en caliente
      - /home/hermes/vault:/vault                       # la que sincroniza Syncthing
      # 99_Private NO existe para el MCP: un tmpfs vacío tapa la carpeta real, así que
      # ni las tools ni un comando que se ejecute aquí dentro pueden ver esos archivos.
      # Lo vigila deploy.sh. El código lo veta además (MCP_VAULT_DENY, core/vault.py).
      - type: tmpfs
        target: /vault/99_Private
        tmpfs:
          size: 1048576
      - /home/ubuntu/apps/lab-ai/data:/data
      - /home/ubuntu/apps/minecraft:/minecraft

  # DESACTIVADO en este VPS (profiles): sin ingesta no hay datos de salud y escribiría cada
  # día una nota vacía en la bóveda. Para activarlo, borra la línea "profiles" y despliega.
  #
  # Parte diario (sueño, recuperación y entrenos) en 02_Daily/_sistema. La de hoy aparece a
  # las 9:00 y se reescribe cuando la ingesta trae datos nuevos (lo mira cada 2 min).
  # Mismo código que el MCP (core/parte_diario.py), pero un proceso aparte con lo justo:
  # sin red, sin puertos, la BD abierta en solo lectura y de la bóveda solo su carpeta.
  nota-diaria:
    build: .
    container_name: nota-diaria
    profiles: ["parte-diario"]
    user: "1001:1001"
    mem_limit: 96m
    network_mode: none
    restart: unless-stopped
    command: ["python", "-m", "core.parte_diario", "loop"]
    environment:
      TZ: Europe/Madrid
      MCP_DAILY_DIR: 02_Daily/_sistema
      MCP_DAILY_DESDE: "09:00"
      MCP_DAILY_INTERVAL_MIN: "2"
    volumes:
      - ./:/app:ro
      - /home/hermes/vault/02_Daily/_sistema:/vault/02_Daily/_sistema
      - /home/ubuntu/apps/lab-ai/data:/data
